<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor & Clinic Portal Login — Murugan Impex™</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #07192f 0%, #0f2b48 100%);
    }
    .auth-container {
      max-width: 520px;
      margin: 3rem auto;
      width: 90%;
      background: #ffffff;
      border-radius: var(--radius-lg, 16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .auth-header {
      background: #0f2438;
      color: #ffffff;
      padding: 2rem 2rem 1.5rem;
      text-align: center;
    }
    .auth-tabs {
      display: flex;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
    }
    .auth-tab {
      flex: 1;
      padding: 1rem;
      text-align: center;
      background: none;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: #ffffff;
      color: #00a896;
      border-bottom: 3px solid #00a896;
    }
    .auth-body {
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-md, 10px);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: #00a896;
      box-shadow: 0 0 0 3px rgba(0, 168, 150, 0.15);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #00a896 0%, #028090 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md, 10px);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-submit:hover {
      opacity: 0.95;
    }
    .btn-submit:active {
      transform: scale(0.99);
    }
    .oauth-btn {
      width: 100%;
      padding: 0.75rem;
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-md, 10px);
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      cursor: pointer;
      margin-bottom: 1.5rem;
      transition: background-color 0.2s;
    }
    .oauth-btn:hover {
      background: #f8fafc;
    }
    .auth-footer {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 1.5rem;
    }
    .status-msg {
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }
    .status-msg.error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .status-msg.success {
      display: block;
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body class="auth-page">

  <!-- Top Simple Nav -->
  <header style="padding: 1.5rem; text-align: center;">
    <a href="index.html" style="color: #ffffff; text-decoration: none; display: inline-flex; align-items: center; gap: 0.75rem;">
      <span style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; color: #ffffff;">MURUGAN IMPEX™</span>
      <span style="background: #00a896; color: #ffffff; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 4px;">DENTAL CLINIC PORTAL</span>
    </a>
  </header>

  <div class="auth-container">
    <div class="auth-header">
      <h2 style="font-family: var(--font-heading); font-size: 1.5rem; margin-bottom: 0.35rem;">Doctor & Clinic Access</h2>
      <p style="font-size: 0.85rem; color: #94a3b8;">CDSCO Certified Dental Imports & Surgical Knowledge Hub</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Clinic Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">New Doctor Registration</button>
    </div>

    <div class="auth-body">
      <div id="status-box" class="status-msg"></div>

      <!-- Google OAuth -->
      <button type="button" class="oauth-btn" onclick="handleGoogleSignIn()">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Sign in with Google Workspace
      </button>

      <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;">
        <hr style="flex: 1; border: none; border-top: 1px solid #e2e8f0;">
        <span style="font-size: 0.75rem; color: #94a3b8; font-weight: 600;">OR USE REGISTERED EMAIL</span>
        <hr style="flex: 1; border: none; border-top: 1px solid #e2e8f0;">
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Registered Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="doctor@clinic.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit" id="btn-login">Sign In to Clinic Portal</button>
      </form>

      <!-- REGISTRATION FORM -->
      <form id="register-form" style="display: none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-name">Doctor Full Name (with Salutation)</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Dr. Rajesh Kumar MDS" required>
        </div>
        <div class="form-group">
          <label for="reg-clinic">Dental Clinic / Hospital Name</label>
          <input type="text" id="reg-clinic" class="form-control" placeholder="Apollo Dental Super Speciality" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reg-dci">DCI / State Reg. No.</label>
            <input type="text" id="reg-dci" class="form-control" placeholder="DCI-TN-45892" required>
          </div>
          <div class="form-group">
            <label for="reg-phone">Direct Mobile / WhatsApp</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-gstin">Clinic GSTIN (Optional for Tax Credit)</label>
          <input type="text" id="reg-gstin" class="form-control" placeholder="33AAAAA0000A1Z5">
        </div>
        <div class="form-group">
          <label for="reg-email">Clinic Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="dr.rajesh@clinic.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Create Portal Password (min 6 chars)</label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>
        <button type="submit" class="btn-submit" id="btn-register">Register Doctor Profile & Clinic</button>
      </form>

      <div class="auth-footer">
        <a href="index.html" style="color: #00a896; text-decoration: none; font-weight: 600;">← Back to Storefront</a>
        &bull;
        <a href="knowledge.html" style="color: #64748b; text-decoration: none;">Knowledge Hub</a>
      </div>
    </div>
  </div>

  <!-- SUPABASE SCRIPTS IN MANDATORY STRICT ORDER -->
  <!-- 1. Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. Supabase Configuration (Creates window.supabaseClient) -->
  <script src="supabase-config.js"></script>
  <!-- 3. Shared Auth Module (window.Auth) -->
  <script src="auth.js"></script>

  <script>
    // Check if user is already logged in, redirect to dashboard
    document.addEventListener('DOMContentLoaded', async function () {
      if (window.Auth) {
        var user = await window.Auth.getCurrentUser();
        if (user) {
          console.log('[login] User already signed in:', user.email);
          var params = new URLSearchParams(window.location.search);
          var dest = params.get('redirect') || 'dashboard.html';
          window.location.href = dest;
        }
      }
    });

    function switchTab(tab) {
      var tabLogin = document.getElementById('tab-login');
      var tabReg = document.getElementById('tab-register');
      var formLogin = document.getElementById('login-form');
      var formReg = document.getElementById('register-form');
      var statusBox = document.getElementById('status-box');
      statusBox.className = 'status-msg';

      if (tab === 'login') {
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
        formLogin.style.display = 'block';
        formReg.style.display = 'none';
      } else {
        tabReg.classList.add('active');
        tabLogin.classList.remove('active');
        formReg.style.display = 'block';
        formLogin.style.display = 'none';
      }
    }

    function showStatus(msg, type) {
      var box = document.getElementById('status-box');
      box.textContent = msg;
      box.className = 'status-msg ' + type;
    }

    async function handleLogin(e) {
      e.preventDefault();
      var email = document.getElementById('login-email').value;
      var password = document.getElementById('login-password').value;
      var btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';
      showStatus('', '');

      var result = await window.Auth.signInWithEmail(email, password);
      btn.disabled = false;
      btn.textContent = 'Sign In to Clinic Portal';

      if (result.error) {
        showStatus(result.error.message, 'error');
        window.Auth.showToast(result.error.message, 'error');
      } else {
        showStatus('Sign in successful! Redirecting...', 'success');
        window.Auth.showToast('Welcome back!', 'success');
        var params = new URLSearchParams(window.location.search);
        var dest = params.get('redirect') || 'dashboard.html';
        setTimeout(function () {
          window.location.href = dest;
        }, 800);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      var name = document.getElementById('reg-name').value;
      var clinic = document.getElementById('reg-clinic').value;
      var dci = document.getElementById('reg-dci').value;
      var phone = document.getElementById('reg-phone').value;
      var gstin = document.getElementById('reg-gstin').value;
      var email = document.getElementById('reg-email').value;
      var password = document.getElementById('reg-password').value;
      var btn = document.getElementById('btn-register');

      btn.disabled = true;
      btn.textContent = 'Creating clinic account...';
      showStatus('', '');

      var result = await window.Auth.signUpWithEmail(email, password, {
        full_name: name,
        clinic_name: clinic,
        dci_number: dci,
        phone: phone,
        gstin: gstin
      });

      btn.disabled = false;
      btn.textContent = 'Register Doctor Profile & Clinic';

      if (result.error) {
        showStatus(result.error.message, 'error');
        window.Auth.showToast(result.error.message, 'error');
      } else {
        showStatus('Account created! Logging in...', 'success');
        window.Auth.showToast('Doctor profile created successfully!', 'success');
        setTimeout(function () {
          window.location.href = 'dashboard.html';
        }, 1200);
      }
    }

    async function handleGoogleSignIn() {
      await window.Auth.signInWithGoogle();
    }
  </script>
</body>
</html>
